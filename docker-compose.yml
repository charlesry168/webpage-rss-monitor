version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - monitor_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/monitors.db
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  monitor_data:
